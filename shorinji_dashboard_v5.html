<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少林寺拳法 大会進行管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f7f7f6;color:#1a1a1a;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:1.25rem}
/* HOME */
.home-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:#f7f7f6}
.home-inner{width:min(420px,100%)}
.home-org{font-size:11px;font-weight:500;letter-spacing:.12em;color:#999;text-transform:uppercase;margin-bottom:1.5rem}
.home-title{font-size:28px;font-weight:700;letter-spacing:-.02em;color:#111;line-height:1.2;margin-bottom:.5rem}
.home-sub{font-size:13px;color:#999;margin-bottom:2.5rem;line-height:1.6}
.home-divider{height:1px;background:#e8e8e6;margin-bottom:2rem}
.home-actions{display:flex;flex-direction:column;gap:.75rem}
.home-btn{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;background:#fff;border:1px solid #e5e5e3;border-radius:10px;cursor:pointer;transition:all .15s;text-align:left}
.home-btn:hover{border-color:#aaa;background:#fdfdfd}
.home-btn-label{font-size:14px;font-weight:600;color:#111;margin-bottom:2px}
.home-btn-desc{font-size:11px;color:#aaa}
.home-btn-arrow{font-size:18px;color:#ccc;flex-shrink:0;margin-left:1rem}
/* LIST */
.list-screen,.create-screen{padding:1rem}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.back-btn{background:none;border:1px solid #e0e0de;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;color:#666;transition:all .15s;white-space:nowrap}
.back-btn:hover{background:#f0f0ee;border-color:#bbb}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tournament-list{display:flex;flex-direction:column;gap:6px}
.tournament-item{background:#fff;border:1px solid #e8e8e6;border-radius:10px;padding:.9rem 1.1rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tournament-item:hover{border-color:#aaa}
.ti-name{font-size:14px;font-weight:600;color:#111}
.ti-meta{font-size:11px;color:#aaa;margin-top:2px}
.ti-arrow{color:#ccc;font-size:18px;flex-shrink:0}
.ti-del{background:none;border:1px solid #fdd;border-radius:6px;padding:3px 8px;cursor:pointer;color:#c44;font-size:11px;flex-shrink:0;transition:all .15s}
.ti-del:hover{background:#fff5f5}
.empty-state{text-align:center;padding:3rem;color:#ccc;font-size:13px}
/* CREATE */
.section-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.section-label{font-size:12px;font-weight:600;color:#666;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em}
.field-label{font-size:12px;color:#666;font-weight:500;margin-bottom:.35rem;display:block}
.text-input{width:100%;padding:9px 12px;border:1.5px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;transition:border-color .15s;background:#fff}
.text-input:focus{outline:none;border-color:#1a1a1a}
.rounds-list{display:flex;flex-direction:column;gap:6px;margin-bottom:.75rem}
.round-item-row{display:flex;align-items:center;gap:8px}
.round-item-row .text-input{flex:1}
.del-btn{background:none;border:1px solid #fecaca;border-radius:6px;padding:6px 10px;cursor:pointer;color:#E24B4A;font-size:13px;flex-shrink:0;transition:all .15s}
.del-btn:hover{background:#fff5f5}
.add-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed #ddd;border-radius:8px;font-size:12px;color:#888;cursor:pointer;background:none;transition:all .15s}
.add-btn:hover{border-color:#1a1a1a;color:#1a1a1a;background:#f9f9f9}
.create-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px;border:1.5px solid #ddd;background:#fff;color:#1a1a1a}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{opacity:.85}
/* DASHBOARD */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.title{font-size:15px;font-weight:600}
.round-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.rtab{padding:6px 12px;border:1px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#666;transition:all .15s;white-space:nowrap}
.rtab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.rtab-add{padding:5px 10px;border:1.5px dashed #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:none;color:#aaa;transition:all .15s}
.rtab-add:hover{border-color:#1a1a1a;color:#1a1a1a}
.summary-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:1rem}
.sum-card{background:#fff;border-radius:8px;padding:.6rem;text-align:center;border:1px solid #eee}
.sum-num{font-size:20px;font-weight:600}
.sum-label{font-size:9px;color:#888;margin-top:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.75rem;padding:.5rem .75rem;background:#fff;border-radius:8px;border:1px solid #eee;align-items:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.alerts{margin-bottom:.75rem}
.alert-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff5f5;border:1px solid #E24B4A;border-radius:8px;font-size:12px;color:#a32d2d;margin-bottom:4px}
.court-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.court-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:.85rem;cursor:pointer;transition:all .15s}
.court-card:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.court-card.stopped{border:2px solid #E24B4A;background:#fff8f8}
.court-card.done{border-color:#1D9E75;background:#f5fbf8}
.court-card.last1{border:2px solid #BA7517;background:#fffbf0}
.court-card.last3{border:1.5px solid #EF9F27;background:#fffdf5}
.court-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px}
.court-num{font-size:20px;font-weight:600;line-height:1}
.court-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-top:2px;white-space:nowrap}
.cb-run{background:#fff3cd;color:#856404}
.cb-done{background:#d1fae5;color:#065f46}
.cb-stop{background:#E24B4A;color:#fff}
.cb-wait{background:#f0f0f0;color:#666}
.cb-last1{background:#BA7517;color:#fff}
.cb-last3{background:#EF9F27;color:#5a3200}
.cb-edit{background:#e0e7ff;color:#3730a3}
.court-category{font-size:10px;color:#888;margin-bottom:7px;line-height:1.4;min-height:28px}
.bar-wrap{background:#f0f0f0;border-radius:3px;height:5px;margin-bottom:4px;overflow:hidden}
.bar-fill{height:5px;border-radius:3px;transition:width .4s}
.court-count{font-size:10px;color:#999;display:flex;justify-content:space-between}
.team-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.tdot{width:8px;height:8px;border-radius:1px;flex-shrink:0}
.edit-hint{font-size:9px;color:#a5b4fc;margin-top:6px}
/* OVERLAY / MODAL */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;padding:5vh 8px 8px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.25rem;width:min(480px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-title{font-size:16px;font-weight:600}
.close-btn{background:none;border:none;cursor:pointer;color:#999;font-size:22px;padding:0 4px;line-height:1}
.tab-bar{display:flex;gap:4px;margin-bottom:1rem;border-bottom:1px solid #eee;padding-bottom:.75rem}
.mtab{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid transparent;color:#888;background:none;transition:all .15s}
.mtab.active{background:#1a1a1a;color:#fff}
.team-list{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem}
.team-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #eee;transition:background .15s}
.team-row:hover{background:#f8f8f8}
.team-row.done-row{opacity:.5}
.team-row.current-row{background:#eff6ff;border-color:#93c5fd}
.team-row.done-row .t-name{text-decoration:line-through;color:#aaa}
.t-idx{font-size:11px;color:#aaa;width:20px;flex-shrink:0}
.t-affil{font-size:10px;color:#888;min-width:60px}
.t-name{flex:1;font-size:12px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.mbtn{padding:8px 14px;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#1a1a1a;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.mbtn:hover{background:#f5f5f5}
.mbtn-danger{border-color:#E24B4A;color:#E24B4A}
.mbtn-danger:hover{background:#fff5f5}
.mbtn-success{border-color:#1D9E75;color:#1D9E75}
.mbtn-success:hover{background:#f0fdf4}
.mbtn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.mbtn-primary:hover{opacity:.85}
.stop-form{border:1.5px solid #E24B4A;border-radius:10px;padding:.85rem;background:#fff8f8;margin-bottom:1rem}
.stop-form-title{font-size:12px;font-weight:600;color:#E24B4A;margin-bottom:8px}
.stop-form textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:64px;color:#1a1a1a;background:#fff;margin-bottom:8px}
.stop-form textarea:focus{outline:none;border-color:#E24B4A}
.stop-form-actions{display:flex;gap:6px}
.stop-banner{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff5f5;border:1.5px solid #E24B4A;border-radius:10px;margin-bottom:12px;font-size:12px;color:#a32d2d}
.stop-banner-label{font-weight:600;color:#E24B4A;margin-bottom:2px}
.edit-panel-label{font-size:11px;color:#666;font-weight:600;margin-bottom:6px;display:block}
.edit-team-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.edit-team-row input{padding:7px 10px;border:1.5px solid #e5e5e5;border-radius:7px;font-size:12px;font-family:inherit;color:#1a1a1a;background:#fff;transition:border-color .15s}
.edit-team-row input:focus{outline:none;border-color:#1a1a1a}
.edit-affil{flex:1;min-width:0}
.edit-name{flex:1.2;min-width:0}
.edit-row-num{font-size:11px;color:#bbb;width:18px;flex-shrink:0;text-align:right}
.round-modal-form{display:flex;flex-direction:column;gap:.75rem}
/* コート選択グリッド（新規作成画面） */
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.cc-card{background:#fff;border:1.5px solid #eee;border-radius:10px;padding:.75rem;cursor:pointer;transition:all .15s;text-align:center}
.cc-card:hover{border-color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cc-card.set{border-color:#1D9E75;background:#f5fbf8}
.cc-num{font-size:18px;font-weight:600;line-height:1;margin-bottom:4px}
.cc-cat{font-size:9px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-count{font-size:9px;color:#bbb;margin-top:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal-inner"></div></div>
<script>
// ============================================================
// localStorage ストレージ層
// ============================================================
const LS_META = 'sj_tournaments';
const LS_STATE = 'sj_state_';

function lsGet(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

// 大会メタ一覧の読み書き
function loadTournamentList(){return lsGet(LS_META)||[];}
function saveTournamentList(list){lsSet(LS_META,list);}

// 進行状態の読み書き
function loadState(id){return lsGet(LS_STATE+id)||{currentRound:'',courts:{}};}
function saveState(id,state){lsSet(LS_STATE+id,state);}

// ============================================================
// アプリ状態
// ============================================================
let screen='home'; // home | list | create | dashboard
let activeTD=null; // 現在開いている大会定義（コート・ラウンド情報）
let activeState=null; // 進行状態 {currentRound, courts:{key:{current,stopped,stopReason}}}
let draftTD=null; // 新規作成中の下書き

// モーダル状態
let modalId=null;
let stopFormOpen=false;
let modalTab='progress';

// ============================================================
// 状態保存ヘルパー
// ============================================================
function saveActive(){
  if(!activeTD)return;
  const list=loadTournamentList();
  const idx=list.findIndex(t=>t.id===activeTD.id);
  if(idx>=0)list[idx]=activeTD; else list.push(activeTD);
  saveTournamentList(list);
  saveState(activeTD.id,activeState);
}

function getCS(round,id){
  const k=round+'_'+id;
  if(!activeState.courts[k])activeState.courts[k]={current:0,stopped:false,stopReason:''};
  return activeState.courts[k];
}

// ============================================================
// ルーター
// ============================================================
function renderApp(){
  if(screen==='home')renderHome();
  else if(screen==='list')renderList();
  else if(screen==='create')renderCreate();
  else if(screen==='dashboard')renderDashboard();
}

// ============================================================
// HOME
// ============================================================
function renderHome(){
  document.getElementById('app').innerHTML=`
    <div class="home-screen">
      <div class="home-inner">
        <div class="home-org">関東学生少林寺拳法連盟</div>
        <div class="home-title">大会進行管理</div>
        <div class="home-sub">コート割の作成・管理と試合進行の記録を行います</div>
        <div class="home-divider"></div>
        <div class="home-actions">
          <button class="home-btn" onclick="goCreate()">
            <div>
              <div class="home-btn-label">新規作成</div>
              <div class="home-btn-desc">大会名・ラウンド・コート割を入力して作成</div>
            </div>
            <div class="home-btn-arrow">›</div>
          </button>
          <button class="home-btn" onclick="goList()">
            <div>
              <div class="home-btn-label">大会を選択</div>
              <div class="home-btn-desc">保存済みの大会から選んで開始</div>
            </div>
            <div class="home-btn-arrow">›</div>
          </button>
        </div>
      </div>
    </div>`;}

// ============================================================
// LIST
// ============================================================
function goList(){screen='list';renderApp();}

function renderList(){
  const list=loadTournamentList();
  document.getElementById('app').innerHTML=`
    <div class="list-screen">
      <div class="page-header">
        <button class="back-btn" onclick="goHome()">← ホーム</button>
        <div class="page-title">大会を選択</div>
      </div>
      <div class="tournament-list">
        ${list.length===0?'<div class="empty-state">保存された大会がありません</div>':
          list.map(td=>`
            <div class="tournament-item" onclick="openTournament('${td.id}')">
              <div style="flex:1;min-width:0">
                <div class="ti-name">${esc(td.name)}</div>
                <div class="ti-meta">${td.rounds.length}ラウンド · 最大16コート</div>
              </div>
              <button class="ti-del" onclick="event.stopPropagation();deleteTournament('${td.id}')">削除</button>
              <div class="ti-arrow">›</div>
            </div>`).join('')}
      </div>
    </div>`;}

function openTournament(id){
  const list=loadTournamentList();
  const td=deepClone(list.find(t=>t.id===id));
  if(!td){alert('大会データが見つかりません');return;}
  activeTD=td;
  const saved=loadState(id);
  const validRound=td.rounds.includes(saved.currentRound)?saved.currentRound:td.rounds[0];
  activeState={currentRound:validRound,courts:saved.courts||{}};
  screen='dashboard';
  renderApp();
}

function deleteTournament(id){
  if(!confirm('この大会を削除しますか？'))return;
  const list=loadTournamentList().filter(t=>t.id!==id);
  saveTournamentList(list);
  try{localStorage.removeItem(LS_STATE+id);}catch(e){}
  renderList();
}

// ============================================================
// CREATE（新規作成）
// ============================================================
function goCreate(){
  draftTD={id:'custom_'+Date.now(),name:'',rounds:['予選ラウンド'],courts:{}};
  ensureDraftCourts();
  screen='create';
  renderApp();
}

function goHome(){activeTD=null;activeState=null;screen='home';renderApp();}

function ensureDraftCourts(){
  draftTD.rounds.forEach(r=>{
    if(!draftTD.courts[r])
      draftTD.courts[r]=Array.from({length:16},(_,i)=>({id:i+1,cat:'',teams:[]}));
  });
}

let createRoundIdx=0;

function renderCreate(){
  const roundsHTML=draftTD.rounds.map((r,i)=>`
    <div class="round-item-row">
      <input class="text-input" value="${esc(r)}" placeholder="ラウンド名" onchange="updateDraftRound(${i},this.value)" />
      ${draftTD.rounds.length>1?`<button class="del-btn" onclick="deleteDraftRound(${i})">✕</button>`:''}
    </div>`).join('');

  document.getElementById('app').innerHTML=`
    <div class="create-screen">
      <div class="page-header">
        <button class="back-btn" onclick="goHome()">← ホーム</button>
        <div class="page-title">新規大会を作成</div>
      </div>
      <div class="section-card">
        <div class="section-label">大会情報</div>
        <label class="field-label">大会名</label>
        <input class="text-input" id="draft-name" value="${esc(draftTD.name)}" placeholder="例：第63回 少林寺拳法関東学生大会" oninput="draftTD.name=this.value" />
      </div>
      <div class="section-card">
        <div class="section-label">ラウンド設定</div>
        <div class="rounds-list">${roundsHTML}</div>
        <button class="add-btn" onclick="addDraftRound()">＋ ラウンドを追加</button>
      </div>
      <div class="section-card">
        <div class="section-label">コート割</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem" id="create-rtabs">
          ${draftTD.rounds.map((r,i)=>`
            <button class="rtab${i===createRoundIdx?' active':''}" onclick="selectCreateRound(${i})">${esc(r)||'（未設定）'}</button>`).join('')}
        </div>
        <div id="create-court-area"></div>
      </div>
      <div class="create-actions">
        <button class="btn" onclick="goHome()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveDraftAndOpen()">作成して開始 →</button>
      </div>
    </div>`;
  renderCreateCourts();}

function selectCreateRound(i){
  createRoundIdx=i;
  document.querySelectorAll('#create-rtabs .rtab').forEach((el,j)=>el.classList.toggle('active',j===i));
  renderCreateCourts();}

function renderCreateCourts(){
  const round=draftTD.rounds[createRoundIdx];
  const courts=draftTD.courts[round]||[];
  document.getElementById('create-court-area').innerHTML=`
    <div class="cc-grid">${courts.map(c=>`
      <div class="cc-card${c.cat||c.teams.length?' set':''}" onclick="openCCModal(${createRoundIdx},${c.id})">
        <div class="cc-num">${c.id}</div>
        <div class="cc-cat">${esc(c.cat)||'未設定'}</div>
        <div class="cc-count">${c.teams.length}チーム</div>
      </div>`).join('')}
    </div>`;}

function openCCModal(roundIdx,courtId){
  const round=draftTD.rounds[roundIdx];
  const court=draftTD.courts[round].find(c=>c.id===courtId);
  window._ccRIdx=roundIdx; window._ccCId=courtId;
  drawCCModal(court,round);
  document.getElementById('overlay').classList.add('open');}

function drawCCModal(court,round){
  const n=Math.max(court.teams.length,2);
  const rows=Array.from({length:n},(_,i)=>{
    const tm=court.teams[i]||{a:'',n:''};
    return buildRow('cc',i,tm.a,tm.n);}).join('');
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-header">
      <div class="modal-title">${court.id}コート — 設定</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div style="font-size:11px;color:#999;margin-bottom:10px">${esc(round)}</div>
    <label class="field-label">種目名</label>
    <input class="text-input" id="cc-cat" value="${esc(court.cat)}" placeholder="例：男子初段" style="margin-bottom:12px" />
    <span class="edit-panel-label">出場チーム <span style="font-size:10px;color:#bbb;font-weight:400">（空欄行は無視）</span></span>
    <div id="cc-rows">${rows}</div>
    <button class="add-btn" style="margin:.5rem 0" onclick="addRow('cc','cc-rows')">＋ 行を追加</button>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn mbtn-primary" onclick="saveCCModal()">保存</button>
    </div>`;}

function saveCCModal(){
  const round=draftTD.rounds[window._ccRIdx];
  const court=draftTD.courts[round].find(c=>c.id===window._ccCId);
  court.cat=document.getElementById('cc-cat').value.trim();
  court.teams=collectRows('cc');
  closeModal();
  renderCreateCourts();}

function updateDraftRound(i,val){
  const old=draftTD.rounds[i];
  const courts=draftTD.courts[old];
  draftTD.rounds[i]=val;
  delete draftTD.courts[old];
  draftTD.courts[val]=courts;}

function addDraftRound(){
  const name='新ラウンド'+(draftTD.rounds.length+1);
  draftTD.rounds.push(name);
  ensureDraftCourts();
  createRoundIdx=draftTD.rounds.length-1;
  renderCreate();}

function deleteDraftRound(i){
  if(draftTD.rounds.length<=1)return;
  delete draftTD.courts[draftTD.rounds[i]];
  draftTD.rounds.splice(i,1);
  createRoundIdx=Math.min(createRoundIdx,draftTD.rounds.length-1);
  renderCreate();}

function saveDraftAndOpen(){
  const nameEl=document.getElementById('draft-name');
  if(nameEl)draftTD.name=nameEl.value.trim();
  if(!draftTD.name){alert('大会名を入力してください');return;}
  // 空行を除去
  draftTD.rounds.forEach(r=>{(draftTD.courts[r]||[]).forEach(c=>{c.teams=c.teams.filter(t=>t.a||t.n);});});
  // 保存
  const list=loadTournamentList();
  list.push(draftTD);
  saveTournamentList(list);
  // 開く
  activeTD=deepClone(draftTD);
  activeState={currentRound:activeTD.rounds[0],courts:{}};
  saveState(activeTD.id,activeState);
  screen='dashboard';
  renderApp();}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(){
  const app=document.getElementById('app');
  const roundsHTML=activeTD.rounds.map(r=>
    `<button class="rtab${r===activeState.currentRound?' active':''}" onclick="setRound('${esc(r)}')">${esc(r)}</button>`
  ).join('')+`<button class="rtab-add" onclick="openAddRoundModal()">＋ ラウンド追加</button>`;

  app.innerHTML=`
    <div class="header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="back-btn" onclick="goHome()">← ホーム</button>
        <div class="title">⛩ ${esc(activeTD.name)}</div>
      </div>
      <div style="font-size:11px;color:#bbb">${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>
    </div>
    <div class="round-tabs">${roundsHTML}</div>
    <div class="summary-bar">${buildSummary()}</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#1D9E75"></div>完了</div>
      <div class="leg-item"><div class="leg-dot" style="background:#378ADD"></div>進行中</div>
      <div class="leg-item"><div class="leg-dot" style="background:#E24B4A"></div>停止</div>
      <div class="leg-item"><div class="leg-dot" style="background:#BA7517"></div>残り1組</div>
      <div class="leg-item"><div class="leg-dot" style="background:#EF9F27"></div>残り2〜3組</div>
      <div class="leg-item"><div class="leg-dot" style="background:#e5e5e5"></div>待機</div>
      <div class="leg-item"><div class="leg-dot" style="background:#a5b4fc"></div>未使用</div>
    </div>
    <div class="alerts" id="dash-alerts">${buildAlerts()}</div>
    <div class="court-grid">${buildGrid()}</div>`;}

function setRound(r){activeState.currentRound=r;saveActive();renderDashboard();}

function buildSummary(){
  const courts=activeTD.courts[activeState.currentRound]||[];
  let total=0,done=0,run=0,warn=0,stop=0;
  courts.forEach(c=>{
    if(!c.teams.length)return;total++;
    const st=courtStatus(c,getCS(activeState.currentRound,c.id));
    if(st==='stopped')stop++;
    else if(st==='done')done++;
    else if(st==='last1'||st==='last3'){run++;warn++;}
    else if(st==='running')run++;
  });
  return [{n:total,l:'使用コート',c:'#1a1a1a'},{n:done,l:'完了',c:'#1D9E75'},{n:run,l:'進行中',c:'#378ADD'},{n:warn,l:'残り1〜3組',c:'#BA7517'},{n:stop,l:'停止中',c:'#E24B4A'}]
    .map(s=>`<div class="sum-card"><div class="sum-num" style="color:${s.c}">${s.n}</div><div class="sum-label">${s.l}</div></div>`).join('');}

function buildAlerts(){
  return (activeTD.courts[activeState.currentRound]||[])
    .filter(c=>c.teams.length&&getCS(activeState.currentRound,c.id).stopped)
    .map(c=>{const cs=getCS(activeState.currentRound,c.id);
      return `<div class="alert-row">⚠️ <strong>${c.id}コート（${esc(c.cat)}）</strong>：${esc(cs.stopReason||'競技停止中')}</div>`;}).join('');}

function buildGrid(){
  return (activeTD.courts[activeState.currentRound]||[]).map(c=>{
    const cs=getCS(activeState.currentRound,c.id);
    const t=c.teams.length,done=Math.min(cs.current,t),pct=t?Math.round(done/t*100):0,rem=t-done;
    const st=courtStatus(c,cs);
    const bc={stopped:'#E24B4A',done:'#1D9E75',last1:'#BA7517',last3:'#EF9F27',running:'#378ADD'}[st]||'#378ADD';
    let badge='';
    if(st==='stopped')badge='<span class="court-badge cb-stop">停止</span>';
    else if(st==='done')badge='<span class="court-badge cb-done">✓ 完了</span>';
    else if(st==='last1')badge='<span class="court-badge cb-last1">残り1組</span>';
    else if(st==='last3')badge=`<span class="court-badge cb-last3">残り${rem}組</span>`;
    else if(st==='running')badge='<span class="court-badge cb-run">進行中</span>';
    else if(st==='waiting')badge='<span class="court-badge cb-wait">待機</span>';
    else badge='<span class="court-badge cb-edit">未使用</span>';
    const dots=t?c.teams.map((_,i)=>{
      const bg=i<done?(st==='stopped'?'#E24B4A':'#1D9E75'):i===done&&done<t?'#378ADD':'#e5e5e5';
      const brd=i===done&&done<t&&st!=='stopped'?'outline:1.5px solid #378ADD;':'';
      return `<div class="tdot" style="background:${bg};${brd}"></div>`;}).join(''):'';
    const cls='court-card'+(['stopped','done','last1','last3'].includes(st)?' '+st:'');
    return `<div class="${cls}" onclick="openModal(${c.id})">
      <div class="court-top"><div class="court-num">${c.id}</div>${badge}</div>
      <div class="court-category">${esc(c.cat)||'（未設定）'}</div>
      ${t?`<div class="bar-wrap"><div class="bar-fill" style="background:${bc};width:${pct}%"></div></div>
      <div class="court-count"><span>${done}/${t}</span><span>${pct}%</span></div>
      <div class="team-dots">${dots}</div>`:'<div class="edit-hint">クリックして設定・編集</div>'}
    </div>`}).join('');}

function courtStatus(c,cs){
  const t=c.teams.length;
  if(!t)return 'inactive';
  if(cs.stopped)return 'stopped';
  if(cs.current>=t)return 'done';
  const rem=t-cs.current;
  if(cs.current>0&&rem===1)return 'last1';
  if(cs.current>0&&rem<=3)return 'last3';
  if(cs.current>0)return 'running';
  return 'waiting';}

// ============================================================
// ラウンド追加モーダル
// ============================================================
function openAddRoundModal(){
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-header">
      <div class="modal-title">ラウンドを追加</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="round-modal-form">
      <label class="field-label">ラウンド名</label>
      <input class="text-input" id="new-round-name" placeholder="例：決勝ラウンド" />
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
        <button class="mbtn" onclick="closeModal()">キャンセル</button>
        <button class="mbtn mbtn-primary" onclick="doAddRound()">追加</button>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('open');}

function doAddRound(){
  const name=(document.getElementById('new-round-name').value||'').trim();
  if(!name){alert('ラウンド名を入力してください');return;}
  if(activeTD.rounds.includes(name)){alert('同じ名前のラウンドが既にあります');return;}
  activeTD.rounds.push(name);
  if(!activeTD.courts[name])
    activeTD.courts[name]=Array.from({length:16},(_,i)=>({id:i+1,cat:'',teams:[]}));
  activeState.currentRound=name;
  saveActive();
  closeModal();
  renderDashboard();}

// ============================================================
// コートモーダル（進行管理 ＋ 編集）
// ============================================================
function openModal(id){
  modalId=id; stopFormOpen=false; modalTab='progress';
  drawModal();
  document.getElementById('overlay').classList.add('open');}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  modalId=null; stopFormOpen=false;}

document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay'))closeModal();});

function drawModal(){
  const c=(activeTD.courts[activeState.currentRound]||[]).find(x=>x.id===modalId);
  if(!c)return;
  const cs=getCS(activeState.currentRound,modalId);
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-header">
      <div class="modal-title">${c.id}コート — ${esc(c.cat)||'（未設定）'}</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="tab-bar">
      <button class="mtab${modalTab==='progress'?' active':''}" onclick="switchMTab('progress')">▶ 進行管理</button>
      <button class="mtab${modalTab==='edit'?' active':''}" onclick="switchMTab('edit')">✏️ コート編集</button>
    </div>
    ${modalTab==='progress'?drawProgressTab(c,cs):drawEditTab(c)}`;}

function switchMTab(tab){
  // 編集タブから離れるとき保存
  if(modalTab==='edit')commitEdit();
  modalTab=tab;
  drawModal();}

// --- 進行タブ ---
function drawProgressTab(c,cs){
  const t=c.teams.length,done=cs.current,rem=t-done;
  if(!t)return `<div style="text-align:center;padding:2rem;color:#bbb;font-size:13px">
    チームが設定されていません。<br>
    <button class="mbtn" style="margin-top:.75rem" onclick="switchMTab('edit')">✏️ 設定する</button></div>`;
  const rows=c.teams.map((tm,i)=>{
    const isDone=i<done,isCur=!cs.stopped&&i===done&&done<t;
    return `<div class="team-row${isDone?' done-row':isCur?' current-row':''}" onclick="toggleTeam(${i})">
      <span class="t-idx">${i+1}</span><span class="t-affil">${esc(tm.a)}</span><span class="t-name">${esc(tm.n)}</span>
      ${isDone?'<span style="color:#1D9E75">✓</span>':isCur?'<span style="color:#378ADD">▶</span>':''}
    </div>`;}).join('');
  const stopBanner=cs.stopped?`<div class="stop-banner">
    <span style="font-size:18px;flex-shrink:0">⚠️</span>
    <div><div class="stop-banner-label">競技停止中</div><div>${esc(cs.stopReason||'—')}</div></div>
    <button class="mbtn mbtn-success" style="margin-left:auto;flex-shrink:0" onclick="doResume()">▶ 再開</button>
  </div>`:'';
  const stopSection=!cs.stopped&&stopFormOpen?`<div class="stop-form">
    <div class="stop-form-title">⏸ 競技停止理由（省略可）</div>
    <textarea id="stop-reason-input" placeholder="例：選手の体調不良"></textarea>
    <div class="stop-form-actions">
      <button class="mbtn mbtn-danger" onclick="doStop()">✓ 停止を確定</button>
      <button class="mbtn" onclick="cancelStopForm()">キャンセル</button>
    </div></div>`:'';
  const remText=!cs.stopped&&done>0&&rem>0&&rem<=3?`<span style="font-weight:600;color:${rem===1?'#BA7517':'#EF9F27'}">（残り${rem}組）</span>`:'';
  return `${stopBanner}
    <div style="font-size:12px;color:#999;margin-bottom:10px">${esc(activeState.currentRound)} ／ ${done}/${t} 完了 ${remText}</div>
    <div class="modal-actions">
      <button class="mbtn" onclick="prevTeam()">← 前へ</button>
      <button class="mbtn mbtn-primary" onclick="nextTeam()">次へ →</button>
      ${!cs.stopped&&!stopFormOpen?`<button class="mbtn mbtn-danger" onclick="openStopForm()">⏸ 停止</button>`:''}
    </div>${stopSection}
    <div class="team-list">${rows}</div>`;}

// --- 編集タブ ---
function drawEditTab(c){
  const n=Math.max(c.teams.length,2);
  const rows=Array.from({length:n},(_,i)=>{
    const tm=c.teams[i]||{a:'',n:''};
    return buildRow('et',i,tm.a,tm.n);}).join('');
  return `<div>
    <label class="field-label">種目名</label>
    <input class="text-input" id="et-cat" value="${esc(c.cat)}" placeholder="例：男子初段" style="margin-bottom:12px" />
    <span class="edit-panel-label">出場チーム <span style="font-size:10px;color:#bbb;font-weight:400">（空欄行は無視）</span></span>
    <div id="et-rows">${rows}</div>
    <button class="add-btn" style="margin:.5rem 0" onclick="addRow('et','et-rows')">＋ 行を追加</button>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn mbtn-primary" onclick="saveEdit()">保存</button>
    </div></div>`;}

function commitEdit(){
  const c=(activeTD.courts[activeState.currentRound]||[]).find(x=>x.id===modalId);
  if(!c)return;
  const catEl=document.getElementById('et-cat');
  if(catEl)c.cat=catEl.value.trim();
  const teams=collectRows('et');
  c.teams=teams;
  const cs=getCS(activeState.currentRound,modalId);
  if(cs.current>teams.length)cs.current=teams.length;}

function saveEdit(){
  commitEdit();
  saveActive();
  modalTab='progress';
  drawModal();
  renderDashboard();}

// ============================================================
// 共通：行の追加・収集
// ============================================================
function buildRow(prefix,i,a,n){
  return `<div class="edit-team-row" id="${prefix}-row-${i}">
    <span class="edit-row-num">${i+1}</span>
    <input class="text-input edit-affil" placeholder="大学名" value="${esc(a||'')}" id="${prefix}-a-${i}" />
    <input class="text-input edit-name" placeholder="名前" value="${esc(n||'')}" id="${prefix}-n-${i}" />
  </div>`;}

function addRow(prefix,containerId){
  const container=document.getElementById(containerId);
  if(!container)return;
  let i=0;
  while(document.getElementById(prefix+'-a-'+i))i++;
  container.insertAdjacentHTML('beforeend',buildRow(prefix,i,'',''));
  const newRow=document.getElementById(prefix+'-row-'+i);
  if(newRow)newRow.scrollIntoView({behavior:'smooth',block:'nearest'});}

function collectRows(prefix){
  const teams=[];let i=0;
  while(true){
    const aEl=document.getElementById(prefix+'-a-'+i);
    const nEl=document.getElementById(prefix+'-n-'+i);
    if(!aEl)break;
    const a=aEl.value.trim(),n=nEl.value.trim();
    if(a||n)teams.push({a,n});
    i++;}
  return teams;}

// ============================================================
// 進行管理操作
// ============================================================
function openStopForm(){stopFormOpen=true;drawModal();setTimeout(()=>{const el=document.getElementById('stop-reason-input');if(el)el.focus();},50);}
function cancelStopForm(){stopFormOpen=false;drawModal();}
function doStop(){
  const inp=document.getElementById('stop-reason-input');
  const cs=getCS(activeState.currentRound,modalId);
  cs.stopped=true;cs.stopReason=(inp?inp.value.trim():'')||'競技停止中';
  saveActive();drawModal();renderDashboard();}
function doResume(){
  const cs=getCS(activeState.currentRound,modalId);
  cs.stopped=false;cs.stopReason='';
  saveActive();drawModal();renderDashboard();}
function nextTeam(){
  const cs=getCS(activeState.currentRound,modalId);
  const c=(activeTD.courts[activeState.currentRound]||[]).find(x=>x.id===modalId);
  if(c&&cs.current<c.teams.length){cs.current++;saveActive();drawModal();renderDashboard();}}
function prevTeam(){
  const cs=getCS(activeState.currentRound,modalId);
  if(cs.current>0){cs.current--;saveActive();drawModal();renderDashboard();}}
function toggleTeam(idx){
  const cs=getCS(activeState.currentRound,modalId);
  cs.current=idx<cs.current?idx:idx+1;
  saveActive();drawModal();renderDashboard();}

// ============================================================
// ユーティリティ
// ============================================================
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function deepClone(o){return JSON.parse(JSON.stringify(o));}

// 起動
renderApp();
</script>
</body>
</html>
