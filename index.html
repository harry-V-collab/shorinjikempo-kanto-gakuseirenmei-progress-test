<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少林寺拳法 大会進行管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f7f7f6;color:#1a1a1a;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:1.25rem}
.home-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.home-inner{width:min(400px,100%)}
.home-org{font-size:11px;font-weight:500;letter-spacing:.12em;color:#999;text-transform:uppercase;margin-bottom:1.25rem}
.home-title{font-size:26px;font-weight:700;letter-spacing:-.02em;color:#111;line-height:1.2;margin-bottom:.4rem}
.home-sub{font-size:13px;color:#999;margin-bottom:2.5rem;line-height:1.6}
.home-divider{height:1px;background:#e8e8e6;margin-bottom:2rem}
.home-actions{display:flex;flex-direction:column;gap:.6rem}
.home-btn{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;background:#fff;border:1px solid #e5e5e3;border-radius:10px;cursor:pointer;transition:border-color .15s;text-align:left;width:100%}
.home-btn:hover{border-color:#999}
.home-btn-label{font-size:14px;font-weight:600;color:#111;margin-bottom:2px}
.home-btn-desc{font-size:11px;color:#aaa}
.home-btn-arrow{font-size:18px;color:#ccc;flex-shrink:0;margin-left:1rem}
.page-wrap{padding:1rem}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.back-btn{background:none;border:1px solid #e0e0de;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;color:#555;transition:all .15s;white-space:nowrap}
.back-btn:hover{background:#f0f0ee;border-color:#aaa}
.page-title{font-size:17px;font-weight:700}
.t-list{display:flex;flex-direction:column;gap:6px}
.t-item{background:#fff;border:1px solid #e8e8e6;border-radius:10px;padding:.9rem 1.1rem;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-item:hover{border-color:#aaa}
.t-name{font-size:14px;font-weight:600;color:#111}
.t-meta{font-size:11px;color:#aaa;margin-top:2px}
.t-arrow{color:#ccc;font-size:18px;flex-shrink:0}
.t-del{background:none;border:1px solid #fdd;border-radius:6px;padding:3px 8px;cursor:pointer;color:#c44;font-size:11px;flex-shrink:0}
.t-del:hover{background:#fff5f5}
.empty{text-align:center;padding:3rem;color:#ccc;font-size:13px}
.s-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.s-label{font-size:11px;font-weight:600;color:#888;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.06em}
.f-label{font-size:12px;color:#666;font-weight:500;margin-bottom:.3rem;display:block}
.inp{width:100%;padding:9px 12px;border:1.5px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff;transition:border-color .15s}
.inp:focus{outline:none;border-color:#1a1a1a}
.round-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.round-row .inp{flex:1}
.del-btn{background:none;border:1px solid #fecaca;border-radius:6px;padding:6px 10px;cursor:pointer;color:#E24B4A;font-size:13px;flex-shrink:0}
.add-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1.5px dashed #ddd;border-radius:8px;font-size:12px;color:#888;cursor:pointer;background:none;transition:all .15s}
.add-btn:hover{border-color:#888;color:#444}
.create-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px;border:1.5px solid #ddd;background:#fff;color:#1a1a1a}
.btn:hover{background:#f5f5f5}
.btn-p{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-p:hover{opacity:.85}
.d-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.d-title{font-size:15px;font-weight:600}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#888;padding:4px 10px;background:#fff;border:1px solid #eee;border-radius:20px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .4s}
.sync-dot.ok{background:#1D9E75}
.sync-dot.err{background:#E24B4A}
.round-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.rtab{padding:6px 12px;border:1px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#666;transition:all .15s;white-space:nowrap}
.rtab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.rtab-add{padding:5px 10px;border:1.5px dashed #ddd;border-radius:8px;font-size:12px;cursor:pointer;background:none;color:#aaa;transition:all .15s}
.rtab-add:hover{border-color:#888;color:#444}
.sum-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:1rem}
.sum-card{background:#fff;border-radius:8px;padding:.6rem;text-align:center;border:1px solid #eee}
.sum-n{font-size:20px;font-weight:600}
.sum-l{font-size:9px;color:#888;margin-top:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.75rem;padding:.5rem .75rem;background:#fff;border-radius:8px;border:1px solid #eee;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.alert-wrap{margin-bottom:.75rem}
.alert-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff5f5;border:1px solid #E24B4A;border-radius:8px;font-size:12px;color:#a32d2d;margin-bottom:4px}
.court-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.court-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:.85rem;cursor:pointer;transition:all .15s}
.court-card:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.court-card.stopped{border:2px solid #E24B4A;background:#fff8f8}
.court-card.done{border-color:#1D9E75;background:#f5fbf8}
.court-card.last1{border:2px solid #BA7517;background:#fffbf0}
.court-card.last3{border:1.5px solid #EF9F27;background:#fffdf5}
.c-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px}
.c-num{font-size:20px;font-weight:600;line-height:1}
.badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-top:2px;white-space:nowrap}
.b-run{background:#fff3cd;color:#856404}.b-done{background:#d1fae5;color:#065f46}
.b-stop{background:#E24B4A;color:#fff}.b-wait{background:#f0f0f0;color:#666}
.b-l1{background:#BA7517;color:#fff}.b-l3{background:#EF9F27;color:#5a3200}
.b-edit{background:#e0e7ff;color:#3730a3}
.c-cat{font-size:10px;color:#888;margin-bottom:7px;line-height:1.4;min-height:28px}
.bar-wrap{background:#f0f0f0;border-radius:3px;height:5px;margin-bottom:4px;overflow:hidden}
.bar-fill{height:5px;border-radius:3px}
.c-count{font-size:10px;color:#999;display:flex;justify-content:space-between}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.dot{width:8px;height:8px;border-radius:1px;flex-shrink:0}
.edit-hint{font-size:9px;color:#a5b4fc;margin-top:6px}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;padding:5vh 8px 8px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.25rem;width:min(480px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.m-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.m-title{font-size:16px;font-weight:600}
.x-btn{background:none;border:none;cursor:pointer;color:#999;font-size:22px;padding:0 4px;line-height:1}
.tab-bar{display:flex;gap:4px;margin-bottom:1rem;border-bottom:1px solid #eee;padding-bottom:.75rem}
.mtab{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid transparent;color:#888;background:none}
.mtab.active{background:#1a1a1a;color:#fff}
.team-list{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem}
.team-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #eee;transition:background .15s}
.team-row:hover{background:#f8f8f8}
.team-row.done-row{opacity:.5}.team-row.cur-row{background:#eff6ff;border-color:#93c5fd}
.team-row.done-row .t-n{text-decoration:line-through;color:#aaa}
.t-i{font-size:11px;color:#aaa;width:20px;flex-shrink:0}.t-a{font-size:10px;color:#888;min-width:60px}.t-n{flex:1;font-size:12px}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.mbtn{padding:8px 14px;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#1a1a1a;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.mbtn:hover{background:#f5f5f5}
.mbtn-d{border-color:#E24B4A;color:#E24B4A}.mbtn-d:hover{background:#fff5f5}
.mbtn-s{border-color:#1D9E75;color:#1D9E75}.mbtn-s:hover{background:#f0fdf4}
.mbtn-p{background:#1a1a1a;color:#fff;border-color:#1a1a1a}.mbtn-p:hover{opacity:.85}
.stop-form{border:1.5px solid #E24B4A;border-radius:10px;padding:.85rem;background:#fff8f8;margin-bottom:1rem}
.stop-form textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:60px;margin-bottom:8px}
.stop-banner{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff5f5;border:1.5px solid #E24B4A;border-radius:10px;margin-bottom:12px;font-size:12px;color:#a32d2d}
.stop-banner-l{font-weight:600;color:#E24B4A;margin-bottom:2px}
.ep-label{font-size:11px;color:#666;font-weight:600;margin-bottom:6px;display:block}
.erow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.erow input{padding:7px 10px;border:1.5px solid #e5e5e5;border-radius:7px;font-size:12px;font-family:inherit;color:#1a1a1a;background:#fff}
.erow input:focus{outline:none;border-color:#1a1a1a}
.ea{flex:1;min-width:0}.en{flex:1.2;min-width:0}.ei{font-size:11px;color:#bbb;width:18px;flex-shrink:0;text-align:right}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cc-card{background:#fff;border:1.5px solid #eee;border-radius:10px;padding:.7rem;cursor:pointer;text-align:center;transition:border-color .15s}
.cc-card:hover{border-color:#888}.cc-card.set{border-color:#1D9E75;background:#f5fbf8}
.cc-n{font-size:18px;font-weight:600;margin-bottom:3px}.cc-c{font-size:9px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc-t{font-size:9px;color:#bbb;margin-top:2px}
.round-m-form{display:flex;flex-direction:column;gap:.75rem}
.loading{text-align:center;padding:3rem;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal-inner"></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ============================================================
// Firebase 初期化
// ============================================================
firebase.initializeApp({
  apiKey:            "AIzaSyD9V0PN0cDS03yxLKLEmXsNNP13r-R0_0E",
  authDomain:        "kantogakurenshorinji-progress.firebaseapp.com",
  databaseURL:       "https://kantogakurenshorinji-progress-default-rtdb.firebaseio.com",
  projectId:         "kantogakurenshorinji-progress",
  storageBucket:     "kantogakurenshorinji-progress.firebasestorage.app",
  messagingSenderId: "214167530097",
  appId:             "1:214167530097:web:8decc086a778b07e2e89d0"
});
const db = firebase.database();

// Firebase のパス
// v7_meta/{id}   大会定義（ラウンド・コート割）※ほぼ変わらない
// v7_state/{id}  進行状態（リアルタイム同期したい部分）
const M = 'v7_meta';
const S = 'v7_state';

// ============================================================
// ローカルキャッシュ（オフライン / 即時表示用）
// ============================================================
const LS = { get(k){ try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):null}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} } };
const lsList  = ()=> LS.get('v7_list')||[];
const setList = v => LS.set('v7_list',v);
const lsSt    = id=> LS.get('v7_st_'+id)||{currentRound:'',courts:{}};
const setSt   = (id,v)=> LS.set('v7_st_'+id,v);
const lsSess  = ()=> LS.get('v7_sess');
const setSess = id=> LS.set('v7_sess',id||null);

// ============================================================
// アプリ状態
// ============================================================
let screen='home', activeTD=null, activeState=null, draftTD=null, createRI=0;
let modalId=null, stopFormOpen=false, modalTab='progress';
let fbListener=null; // 現在のリアルタイムリスナー

// ============================================================
// Firebase 書き込み（エラーは無視して継続）
// ============================================================
const fbSet = (path,val)=> db.ref(path).set(val).catch(()=>{});
const fbDel = path     => db.ref(path).remove().catch(()=>{});

function syncDot(ok){
  const d=document.getElementById('sdot'), l=document.getElementById('slabel');
  if(d) d.className='sync-dot '+(ok?'ok':'err');
  if(l) l.textContent=ok?'同期中':'オフライン';
}

// ============================================================
// リアルタイムリスナー管理
// — 進行状態(S/{id})だけをリアルタイム監視する
// ============================================================
function startListen(id){
  stopListen();
  fbListener = db.ref(S+'/'+id);
  fbListener.on('value', snap=>{
    const val = snap.val();
    syncDot(true);
    if(!val || !activeTD) return;
    // Firebaseの値でactiveStateを上書き（他端末の変更を反映）
    const r = activeTD.rounds.includes(val.currentRound) ? val.currentRound : activeTD.rounds[0];
    activeState = { currentRound: r, courts: val.courts||{} };
    setSt(id, activeState);
    if(screen==='dash'){ renderDash(); if(modalId!==null) drawModal(); }
  }, ()=> syncDot(false));
}
function stopListen(){
  if(fbListener){ fbListener.off(); fbListener=null; }
}

// ============================================================
// 保存（ローカル + Firebase 同時）
// ============================================================
function saveAll(){
  if(!activeTD||!activeState) return;
  // メタ（大会定義）
  const list=lsList(); const i=list.findIndex(t=>t.id===activeTD.id);
  if(i>=0) list[i]=activeTD; else list.push(activeTD);
  setList(list);
  fbSet(M+'/'+activeTD.id, activeTD);
  // 進行状態
  setSt(activeTD.id, activeState);
  fbSet(S+'/'+activeTD.id, activeState);
}

function getCS(round,id){
  const k=round+'_'+id;
  if(!activeState.courts[k]) activeState.courts[k]={current:0,stopped:false,stopReason:''};
  return activeState.courts[k];
}

// ============================================================
// ルーター
// ============================================================
function renderApp(){
  if(screen==='home')        renderHome();
  else if(screen==='list')   renderList();
  else if(screen==='create') renderCreate();
  else if(screen==='dash')   renderDash();
}

// ============================================================
// HOME
// ============================================================
function renderHome(){
  setSess(null);
  document.getElementById('app').innerHTML=`
    <div class="home-screen"><div class="home-inner">
      <div class="home-org">関東学生少林寺拳法連盟</div>
      <div class="home-title">大会進行管理</div>
      <div class="home-sub">コート割の作成・管理と試合進行の記録を行います</div>
      <div class="home-divider"></div>
      <div class="home-actions">
        <button class="home-btn" onclick="goCreate()">
          <div><div class="home-btn-label">新規作成</div><div class="home-btn-desc">大会名・ラウンド・コート割を入力して作成</div></div>
          <div class="home-btn-arrow">›</div>
        </button>
        <button class="home-btn" onclick="goList()">
          <div><div class="home-btn-label">大会を選択</div><div class="home-btn-desc">保存済みの大会から選んで開始</div></div>
          <div class="home-btn-arrow">›</div>
        </button>
      </div>
    </div></div>`;}

// ============================================================
// LIST — Firebaseから最新を取得、なければローカルで表示
// ============================================================
function goList(){
  screen='list';
  document.getElementById('app').innerHTML='<div class="loading">読み込み中...</div>';
  db.ref(M).once('value', snap=>{
    const val=snap.val();
    if(val){
      const list=Object.values(val);
      setList(list); // ローカルにも保存
      renderList(list);
    } else {
      renderList([]);
    }
  }, ()=> renderList(lsList())); // Firebase失敗時はローカルで表示
}

function renderList(list){
  document.getElementById('app').innerHTML=`
    <div class="page-wrap">
      <div class="page-header">
        <button class="back-btn" onclick="screen='home';renderApp()">← ホーム</button>
        <div class="page-title">大会を選択</div>
      </div>
      <div class="t-list">
        ${list.length===0
          ? '<div class="empty">保存された大会がありません</div>'
          : list.map(td=>`
              <div class="t-item" onclick="openTournament('${esc(td.id)}')">
                <div style="flex:1;min-width:0">
                  <div class="t-name">${esc(td.name)}</div>
                  <div class="t-meta">${td.rounds.length}ラウンド · 最大16コート</div>
                </div>
                <button class="t-del" onclick="event.stopPropagation();delTournament('${esc(td.id)}')">削除</button>
                <div class="t-arrow">›</div>
              </div>`).join('')}
      </div>
    </div>`;}

// ============================================================
// 大会を開く
// ① ローカルキャッシュがあれば即座に画面表示（待ち時間ゼロ）
// ② Firebaseから最新メタを取得してバックグラウンドで更新
// ③ 進行状態はリアルタイムリスナーで常に最新を受信
// ============================================================
function openTournament(id){
  const cached = lsList().find(t=>t.id===id);

  if(cached){
    // キャッシュで即座に開く
    _boot(id, cached);
  } else {
    // キャッシュなし → Firebaseから取得
    document.getElementById('app').innerHTML='<div class="loading">読み込み中...</div>';
    db.ref(M+'/'+id).once('value', snap=>{
      const td=snap.val();
      if(!td){ alert('大会データが見つかりません'); goList(); return; }
      const list=lsList(); list.push(td); setList(list);
      _boot(id, td);
    }, ()=>{ alert('読み込みに失敗しました'); goList(); });
  }
}

function _boot(id, td){
  activeTD = deepClone(td);
  const saved = lsSt(id);
  const r = activeTD.rounds.includes(saved.currentRound) ? saved.currentRound : activeTD.rounds[0];
  activeState = { currentRound:r, courts: saved.courts||{} };
  screen = 'dash';
  setSess(id);
  renderApp();

  // ① Firebaseからメタの最新版をバックグラウンド取得
  db.ref(M+'/'+id).once('value', snap=>{
    const latest=snap.val();
    if(latest){
      activeTD = deepClone(latest);
      const list=lsList(); const i=list.findIndex(t=>t.id===id);
      if(i>=0) list[i]=latest; else list.push(latest);
      setList(list);
      if(screen==='dash') renderDash();
    }
  }).catch(()=>{});

  // ② 進行状態のリアルタイムリスナー開始
  startListen(id);
}

function delTournament(id){
  if(!confirm('この大会を削除しますか？')) return;
  setList(lsList().filter(t=>t.id!==id));
  try{ localStorage.removeItem('v7_st_'+id); }catch(e){}
  fbDel(M+'/'+id); fbDel(S+'/'+id);
  goList();}

// ============================================================
// 新規作成
// ============================================================
function goCreate(){
  draftTD={id:'t'+Date.now(),name:'',rounds:['予選ラウンド'],courts:{}};
  ensureDrafts(); createRI=0; screen='create'; renderApp();}

function ensureDrafts(){
  draftTD.rounds.forEach(r=>{
    if(!draftTD.courts[r])
      draftTD.courts[r]=Array.from({length:16},(_,i)=>({id:i+1,cat:'',teams:[]}));
  });}

function goHome(){ stopListen(); activeTD=null; activeState=null; screen='home'; renderApp(); }

function renderCreate(){
  document.getElementById('app').innerHTML=`
    <div class="page-wrap">
      <div class="page-header">
        <button class="back-btn" onclick="screen='home';renderApp()">← ホーム</button>
        <div class="page-title">新規大会を作成</div>
      </div>
      <div class="s-card">
        <div class="s-label">大会情報</div>
        <label class="f-label">大会名</label>
        <input class="inp" id="draft-name" value="${esc(draftTD.name)}" placeholder="例：第63回 少林寺拳法関東学生大会" oninput="draftTD.name=this.value" />
      </div>
      <div class="s-card">
        <div class="s-label">ラウンド設定</div>
        ${draftTD.rounds.map((r,i)=>`
          <div class="round-row">
            <input class="inp" value="${esc(r)}" placeholder="ラウンド名" onchange="updDraftRound(${i},this.value)" />
            ${draftTD.rounds.length>1?`<button class="del-btn" onclick="delDraftRound(${i})">✕</button>`:''}
          </div>`).join('')}
        <button class="add-btn" onclick="addDraftRound()">＋ ラウンドを追加</button>
      </div>
      <div class="s-card">
        <div class="s-label">コート割</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem" id="c-rtabs">
          ${draftTD.rounds.map((r,i)=>`
            <button class="rtab${i===createRI?' active':''}" onclick="selCRI(${i})">${esc(r)||'未設定'}</button>`).join('')}
        </div>
        <div id="c-courts"></div>
      </div>
      <div class="create-footer">
        <button class="btn" onclick="screen='home';renderApp()">キャンセル</button>
        <button class="btn btn-p" onclick="saveDraftAndOpen()">作成して開始 →</button>
      </div>
    </div>`;
  renderCCourts();}

function selCRI(i){ createRI=i; document.querySelectorAll('#c-rtabs .rtab').forEach((el,j)=>el.classList.toggle('active',j===i)); renderCCourts(); }
function renderCCourts(){
  const r=draftTD.rounds[createRI], cs=draftTD.courts[r]||[];
  document.getElementById('c-courts').innerHTML=`
    <div class="cc-grid">${cs.map(c=>`
      <div class="cc-card${c.cat||c.teams.length?' set':''}" onclick="openCCM(${createRI},${c.id})">
        <div class="cc-n">${c.id}</div><div class="cc-c">${esc(c.cat)||'未設定'}</div><div class="cc-t">${c.teams.length}チーム</div>
      </div>`).join('')}</div>`;}

function openCCM(ri,cid){
  window._ccRi=ri; window._ccCid=cid;
  const r=draftTD.rounds[ri], c=draftTD.courts[r].find(x=>x.id===cid);
  const rows=Array.from({length:Math.max(c.teams.length,2)},(_,i)=>buildRow('cc',i,c.teams[i]?.a||'',c.teams[i]?.n||'')).join('');
  document.getElementById('modal-inner').innerHTML=`
    <div class="m-header"><div class="m-title">${c.id}コート — 設定</div><button class="x-btn" onclick="closeModal()">×</button></div>
    <div style="font-size:11px;color:#999;margin-bottom:10px">${esc(r)}</div>
    <label class="f-label">種目名</label>
    <input class="inp" id="cc-cat" value="${esc(c.cat)}" placeholder="例：男子初段" style="margin-bottom:12px" />
    <span class="ep-label">出場チーム <span style="font-size:10px;color:#bbb;font-weight:400">（空欄行は無視）</span></span>
    <div id="cc-rows">${rows}</div>
    <button class="add-btn" style="margin:.5rem 0" onclick="addRow('cc','cc-rows')">＋ 行を追加</button>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn mbtn-p" onclick="saveCCM()">保存</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');}

function saveCCM(){
  const r=draftTD.rounds[window._ccRi], c=draftTD.courts[r].find(x=>x.id===window._ccCid);
  c.cat=document.getElementById('cc-cat').value.trim(); c.teams=collectRows('cc');
  closeModal(); renderCCourts();}

function updDraftRound(i,v){ const o=draftTD.rounds[i],cs=draftTD.courts[o]; draftTD.rounds[i]=v; delete draftTD.courts[o]; draftTD.courts[v]=cs; }
function addDraftRound(){ const n='新ラウンド'+(draftTD.rounds.length+1); draftTD.rounds.push(n); ensureDrafts(); createRI=draftTD.rounds.length-1; renderCreate(); }
function delDraftRound(i){ if(draftTD.rounds.length<=1)return; delete draftTD.courts[draftTD.rounds[i]]; draftTD.rounds.splice(i,1); createRI=Math.min(createRI,draftTD.rounds.length-1); renderCreate(); }

function saveDraftAndOpen(){
  const el=document.getElementById('draft-name'); if(el) draftTD.name=el.value.trim();
  if(!draftTD.name){ alert('大会名を入力してください'); return; }
  draftTD.rounds.forEach(r=>{ (draftTD.courts[r]||[]).forEach(c=>{ c.teams=c.teams.filter(t=>t.a||t.n); }); });
  const list=lsList(); list.push(draftTD); setList(list);
  fbSet(M+'/'+draftTD.id, draftTD);
  activeTD=deepClone(draftTD);
  activeState={currentRound:activeTD.rounds[0],courts:{}};
  setSt(activeTD.id,activeState);
  fbSet(S+'/'+activeTD.id,activeState);
  screen='dash'; setSess(activeTD.id);
  renderApp(); startListen(activeTD.id);}

// ============================================================
// DASHBOARD
// ============================================================
function renderDash(){
  if(!activeTD||!activeState){ screen='home'; renderApp(); return; }
  const rHTML=activeTD.rounds.map(r=>
    `<button class="rtab${r===activeState.currentRound?' active':''}" onclick="setRound('${esc(r)}')">${esc(r)}</button>`
  ).join('')+`<button class="rtab-add" onclick="openAddRoundModal()">＋ ラウンド追加</button>`;
  document.getElementById('app').innerHTML=`
    <div class="d-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="back-btn" onclick="goHome()">← ホーム</button>
        <div class="d-title">${esc(activeTD.name)}</div>
      </div>
      <div class="sync-pill"><span class="sync-dot" id="sdot"></span><span id="slabel" style="font-size:11px;color:#888">接続中...</span></div>
    </div>
    <div class="round-tabs">${rHTML}</div>
    <div class="sum-bar">${buildSum()}</div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div>完了</div>
      <div class="leg"><div class="leg-dot" style="background:#378ADD"></div>進行中</div>
      <div class="leg"><div class="leg-dot" style="background:#E24B4A"></div>停止</div>
      <div class="leg"><div class="leg-dot" style="background:#BA7517"></div>残り1組</div>
      <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>残り2〜3組</div>
      <div class="leg"><div class="leg-dot" style="background:#e5e5e5"></div>待機</div>
      <div class="leg"><div class="leg-dot" style="background:#a5b4fc"></div>未使用</div>
    </div>
    <div class="alert-wrap">${buildAlerts()}</div>
    <div class="court-grid">${buildGrid()}</div>`;}

function setRound(r){ activeState.currentRound=r; saveAll(); renderDash(); }

function buildSum(){
  const cs=activeTD.courts[activeState.currentRound]||[];
  let T=0,D=0,R=0,W=0,ST=0;
  cs.forEach(c=>{ if(!c.teams.length)return; T++; const s=cSt(c,getCS(activeState.currentRound,c.id));
    if(s==='stopped')ST++; else if(s==='done')D++; else if(s==='last1'||s==='last3'){R++;W++;} else if(s==='running')R++; });
  return [{n:T,l:'使用コート',c:'#1a1a1a'},{n:D,l:'完了',c:'#1D9E75'},{n:R,l:'進行中',c:'#378ADD'},{n:W,l:'残り1〜3組',c:'#BA7517'},{n:ST,l:'停止中',c:'#E24B4A'}]
    .map(s=>`<div class="sum-card"><div class="sum-n" style="color:${s.c}">${s.n}</div><div class="sum-l">${s.l}</div></div>`).join('');}

function buildAlerts(){
  return (activeTD.courts[activeState.currentRound]||[])
    .filter(c=>c.teams.length&&getCS(activeState.currentRound,c.id).stopped)
    .map(c=>{ const cs=getCS(activeState.currentRound,c.id);
      return `<div class="alert-row">⚠️ <strong>${c.id}コート（${esc(c.cat)}）</strong>：${esc(cs.stopReason||'停止中')}</div>`; }).join('');}

function buildGrid(){
  return (activeTD.courts[activeState.currentRound]||[]).map(c=>{
    const cs=getCS(activeState.currentRound,c.id);
    const t=c.teams.length,dn=Math.min(cs.current,t),pct=t?Math.round(dn/t*100):0,rem=t-dn;
    const st=cSt(c,cs);
    const bc={stopped:'#E24B4A',done:'#1D9E75',last1:'#BA7517',last3:'#EF9F27',running:'#378ADD'}[st]||'#378ADD';
    let badge='';
    if(st==='stopped') badge='<span class="badge b-stop">停止</span>';
    else if(st==='done') badge='<span class="badge b-done">✓ 完了</span>';
    else if(st==='last1') badge='<span class="badge b-l1">残り1組</span>';
    else if(st==='last3') badge=`<span class="badge b-l3">残り${rem}組</span>`;
    else if(st==='running') badge='<span class="badge b-run">進行中</span>';
    else if(st==='waiting') badge='<span class="badge b-wait">待機</span>';
    else badge='<span class="badge b-edit">未使用</span>';
    const dots=t?c.teams.map((_,i)=>{
      const bg=i<dn?(st==='stopped'?'#E24B4A':'#1D9E75'):i===dn&&dn<t?'#378ADD':'#e5e5e5';
      const brd=i===dn&&dn<t&&st!=='stopped'?'outline:1.5px solid #378ADD;':'';
      return `<div class="dot" style="background:${bg};${brd}"></div>`;}).join(''):'';
    const cls='court-card'+(['stopped','done','last1','last3'].includes(st)?' '+st:'');
    return `<div class="${cls}" onclick="openModal(${c.id})">
      <div class="c-top"><div class="c-num">${c.id}</div>${badge}</div>
      <div class="c-cat">${esc(c.cat)||'（未設定）'}</div>
      ${t?`<div class="bar-wrap"><div class="bar-fill" style="background:${bc};width:${pct}%"></div></div>
      <div class="c-count"><span>${dn}/${t}</span><span>${pct}%</span></div>
      <div class="dots">${dots}</div>`:'<div class="edit-hint">クリックして設定・編集</div>'}
    </div>`}).join('');}

function cSt(c,cs){
  const t=c.teams.length; if(!t)return 'inactive';
  if(cs.stopped)return 'stopped'; if(cs.current>=t)return 'done';
  const r=t-cs.current;
  if(cs.current>0&&r===1)return 'last1'; if(cs.current>0&&r<=3)return 'last3';
  if(cs.current>0)return 'running'; return 'waiting';}

// ============================================================
// ラウンド追加
// ============================================================
function openAddRoundModal(){
  document.getElementById('modal-inner').innerHTML=`
    <div class="m-header"><div class="m-title">ラウンドを追加</div><button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="round-m-form">
      <label class="f-label">ラウンド名</label>
      <input class="inp" id="new-round" placeholder="例：決勝ラウンド" />
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
        <button class="mbtn" onclick="closeModal()">キャンセル</button>
        <button class="mbtn mbtn-p" onclick="doAddRound()">追加</button>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('open');}

function doAddRound(){
  const n=(document.getElementById('new-round').value||'').trim();
  if(!n){ alert('ラウンド名を入力してください'); return; }
  if(activeTD.rounds.includes(n)){ alert('同じ名前のラウンドが既にあります'); return; }
  activeTD.rounds.push(n);
  activeTD.courts[n]=Array.from({length:16},(_,i)=>({id:i+1,cat:'',teams:[]}));
  activeState.currentRound=n;
  saveAll(); closeModal(); renderDash();}

// ============================================================
// コートモーダル
// ============================================================
function openModal(id){ modalId=id; stopFormOpen=false; modalTab='progress'; drawModal(); document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); modalId=null; stopFormOpen=false; }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target===document.getElementById('overlay')) closeModal(); });

function drawModal(){
  const c=(activeTD.courts[activeState.currentRound]||[]).find(x=>x.id===modalId);
  if(!c) return;
  const cs=getCS(activeState.currentRound,modalId);
  document.getElementById('modal-inner').innerHTML=`
    <div class="m-header"><div class="m-title">${c.id}コート — ${esc(c.cat)||'未設定'}</div><button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="tab-bar">
      <button class="mtab${modalTab==='progress'?' active':''}" onclick="switchTab('progress')">▶ 進行管理</button>
      <button class="mtab${modalTab==='edit'?' active':''}" onclick="switchTab('edit')">✏️ コート編集</button>
    </div>
    ${modalTab==='progress'?drawProg(c,cs):drawEdit(c)}`;}

function switchTab(t){ if(modalTab==='edit') commitEdit(); modalTab=t; drawModal(); }

function drawProg(c,cs){
  const t=c.teams.length,dn=cs.current,rem=t-dn;
  if(!t) return `<div style="text-align:center;padding:2rem;color:#bbb;font-size:13px">チームが設定されていません。<br><button class="mbtn" style="margin-top:.75rem" onclick="switchTab('edit')">✏️ 設定する</button></div>`;
  const rows=c.teams.map((tm,i)=>{ const isDn=i<dn,isCur=!cs.stopped&&i===dn&&dn<t;
    return `<div class="team-row${isDn?' done-row':isCur?' cur-row':''}" onclick="toggleTeam(${i})">
      <span class="t-i">${i+1}</span><span class="t-a">${esc(tm.a)}</span><span class="t-n">${esc(tm.n)}</span>
      ${isDn?'<span style="color:#1D9E75">✓</span>':isCur?'<span style="color:#378ADD">▶</span>':''}
    </div>`}).join('');
  const sBanner=cs.stopped?`<div class="stop-banner"><span style="font-size:18px;flex-shrink:0">⚠️</span>
    <div><div class="stop-banner-l">競技停止中</div><div>${esc(cs.stopReason||'—')}</div></div>
    <button class="mbtn mbtn-s" style="margin-left:auto;flex-shrink:0" onclick="doResume()">▶ 再開</button></div>`:'';
  const sSec=!cs.stopped&&stopFormOpen?`<div class="stop-form">
    <div style="font-size:12px;font-weight:600;color:#E24B4A;margin-bottom:8px">⏸ 競技停止理由（省略可）</div>
    <textarea id="stop-inp" placeholder="例：選手の体調不良"></textarea>
    <div style="display:flex;gap:6px">
      <button class="mbtn mbtn-d" onclick="doStop()">✓ 停止を確定</button>
      <button class="mbtn" onclick="stopFormOpen=false;drawModal()">キャンセル</button>
    </div></div>`:'';
  const remTxt=!cs.stopped&&dn>0&&rem>0&&rem<=3?`<span style="font-weight:600;color:${rem===1?'#BA7517':'#EF9F27'}">（残り${rem}組）</span>`:'';
  return `${sBanner}
    <div style="font-size:12px;color:#999;margin-bottom:10px">${esc(activeState.currentRound)} ／ ${dn}/${t} 完了 ${remTxt}</div>
    <div class="m-actions">
      <button class="mbtn" onclick="prevTeam()">← 前へ</button>
      <button class="mbtn mbtn-p" onclick="nextTeam()">次へ →</button>
      ${!cs.stopped&&!stopFormOpen?`<button class="mbtn mbtn-d" onclick="stopFormOpen=true;drawModal()">⏸ 停止</button>`:''}
    </div>${sSec}<div class="team-list">${rows}</div>`;}

function drawEdit(c){
  const n=Math.max(c.teams.length,2);
  const rows=Array.from({length:n},(_,i)=>buildRow('et',i,c.teams[i]?.a||'',c.teams[i]?.n||'')).join('');
  return `<div>
    <label class="f-label">種目名</label>
    <input class="inp" id="et-cat" value="${esc(c.cat)}" placeholder="例：男子初段" style="margin-bottom:12px" />
    <span class="ep-label">出場チーム <span style="font-size:10px;color:#bbb;font-weight:400">（空欄行は無視）</span></span>
    <div id="et-rows">${rows}</div>
    <button class="add-btn" style="margin:.5rem 0" onclick="addRow('et','et-rows')">＋ 行を追加</button>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem">
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn mbtn-p" onclick="saveEdit()">保存</button>
    </div></div>`;}

function commitEdit(){
  const c=(activeTD.courts[activeState.currentRound]||[]).find(x=>x.id===modalId); if(!c)return;
  const el=document.getElementById('et-cat'); if(el) c.cat=el.value.trim();
  const teams=collectRows('et'); c.teams=teams;
  const cs=getCS(activeState.currentRound,modalId); if(cs.current>teams.length) cs.current=teams.length;}

function saveEdit(){ commitEdit(); saveAll(); modalTab='progress'; drawModal(); renderDash(); }

// ============================================================
// 行の追加・収集
// ============================================================
function buildRow(p,i,a,n){ return `<div class="erow" id="${p}-row-${i}"><span class="ei">${i+1}</span><input class="inp ea" placeholder="大学名" value="${esc(a)}" id="${p}-a-${i}" /><input class="inp en" placeholder="名前" value="${esc(n)}" id="${p}-n-${i}" /></div>`; }
function addRow(p,cid){ const el=document.getElementById(cid); if(!el)return; let i=0; while(document.getElementById(p+'-a-'+i))i++; el.insertAdjacentHTML('beforeend',buildRow(p,i,'','')); const r=document.getElementById(p+'-row-'+i); if(r)r.scrollIntoView({behavior:'smooth',block:'nearest'}); }
function collectRows(p){ const out=[]; let i=0; while(true){ const a=document.getElementById(p+'-a-'+i),n=document.getElementById(p+'-n-'+i); if(!a)break; if(a.value.trim()||n.value.trim())out.push({a:a.value.trim(),n:n.value.trim()}); i++; } return out; }

// ============================================================
// 進行操作
// ============================================================
function doStop(){ const inp=document.getElementById('stop-inp'); const cs=getCS(activeState.currentRound,modalId); cs.stopped=true; cs.stopReason=(inp?inp.value.trim():'')||'競技停止中'; saveAll(); drawModal(); renderDash(); }
function doResume(){ const cs=getCS(activeState.currentRound,modalId); cs.stopped=false; cs.stopReason=''; saveAll(); drawModal(); renderDash(); }
function nextTeam(){ const cs=getCS(activeState.currentRound,modalId); const c=(activeTD.courts[activeState.currentRound]||[]).find(x=>x.id===modalId); if(c&&cs.current<c.teams.length){ cs.current++; saveAll(); drawModal(); renderDash(); } }
function prevTeam(){ const cs=getCS(activeState.currentRound,modalId); if(cs.current>0){ cs.current--; saveAll(); drawModal(); renderDash(); } }
function toggleTeam(idx){ const cs=getCS(activeState.currentRound,modalId); cs.current=idx<cs.current?idx:idx+1; saveAll(); drawModal(); renderDash(); }

// ============================================================
// ユーティリティ
// ============================================================
function esc(s){ return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

// ============================================================
// 起動 — セッション復元
// ============================================================
(function boot(){
  const id = lsSess();
  if(id){
    const cached = lsList().find(t=>t.id===id);
    if(cached){
      // キャッシュで即座に表示してからリスナー開始
      activeTD = deepClone(cached);
      const saved = lsSt(id);
      const r = activeTD.rounds.includes(saved.currentRound) ? saved.currentRound : activeTD.rounds[0];
      activeState = { currentRound:r, courts:saved.courts||{} };
      screen = 'dash';
      renderApp();
      // バックグラウンドでメタ最新化 + リスナー開始
      db.ref(M+'/'+id).once('value', snap=>{
        const latest=snap.val();
        if(latest){
          activeTD=deepClone(latest);
          const list=lsList(); const i=list.findIndex(t=>t.id===id);
          if(i>=0)list[i]=latest; else list.push(latest);
          setList(list);
          if(screen==='dash') renderDash();
        }
      }).catch(()=>{});
      startListen(id);
      return;
    }
  }
  renderApp();
})();
</script>
</body>
</html>
